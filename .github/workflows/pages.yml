name: Deploy game to Pages

# Manual-only: GitHub Pages must first be enabled in repo Settings → Pages
# (Source: GitHub Actions). Once enabled, run this workflow to publish game/.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload game/ as the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./game
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
